name: Test skip-users comma-separated input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          skip-users: "bot-user,dependabot[bot],renovate[bot]"
      - name: Assert action ran with comma-separated skip-users (succeeds or fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with comma-separated skip-users configured"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or event is not pull_request)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

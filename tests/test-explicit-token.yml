name: Test explicit repo-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run auto-author-assign with explicit token
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true
        # Explicitly passing the token exercises the repo-token input code path.
        # Under workflow_dispatch there is no PR, so the action is expected to
        # call core.setFailed with "Can't get payload. Check you trigger event"

      - name: Assert action failed with expected error (no PR context)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with no-PR-context error, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly reported failure when no PR context is present (explicit token path)"

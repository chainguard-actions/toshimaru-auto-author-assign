name: Test default token usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with default token (no explicit repo-token input)
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed due to missing payload (not token error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because there is no PR/issue payload
          # (workflow_dispatch has no pull_request or issue in context.payload).
          # If it failed for a different reason (e.g. bad token), the error
          # message would differ, but the outcome is still 'failure'.
          # We assert 'failure' to confirm the action ran and detected the
          # missing payload — not that it crashed due to a missing/invalid token.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with payload error, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no PR/issue payload is present (default token accepted)"

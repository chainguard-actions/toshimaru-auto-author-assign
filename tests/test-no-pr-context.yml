name: Test no PR context graceful failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure - no PR context under workflow_dispatch)
        id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed with expected payload error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR/issue payload is present, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no PR/issue payload is present"

name: Test skip-users input without pull_request payload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          skip-users: |
            some-bot-user, Another-User
            third-user
      - name: Assert action failed due to missing PR/issue payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (payload check precedes skip-users handling)"
            exit 1
          fi
          echo "PASS"

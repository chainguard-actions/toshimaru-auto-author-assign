name: Test no PR payload error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request or issue payload.
      # Under workflow_dispatch there is no such payload, so the action
      # should fail with a specific error message. We capture that outcome
      # by allowing the step to fail and then asserting on the result.
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no PR/issue payload is present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when triggered without a PR/issue payload"
